name: Format module runtime sources

on:
  push:
    branches: [main]

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-module-runtime]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format module runtime sources
        run: npx prettier --write "src/module-runtime/**/*.ts" "src/app.module.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/module-runtime src/app.module.ts
          git commit -m "style(api): format module runtime sources"
          git push
