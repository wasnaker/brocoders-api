name: Format PostgreSQL branch

on:
  push:
    branches:
      - refactor/postgresql-only

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Format TypeScript sources
        run: npx prettier --write "src/**/*.ts" "test/**/*.ts" ".install-scripts/**/*.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test .install-scripts
          git commit -m "style: format PostgreSQL sources"
          git push origin HEAD:refactor/postgresql-only
