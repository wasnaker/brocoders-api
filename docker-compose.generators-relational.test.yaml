# Generator e2e tests — PostgreSQL / TypeORM.
#
# Kept separate from docker-compose.relational.test.yaml because the generator
# CRUD tests generate and run migrations for freshly-generated entities before
# the API boots. That extra step lives in test/generators/startup.relational.test.sh.
services:
  postgres:
    image: postgres:17.9-alpine
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    expose:
      - 1080
      - 1025

  api:
    build:
      context: .
      dockerfile: relational.test.Dockerfile
    env_file:
      - env-example-relational
    ports:
      - '3001:3001'
    volumes:
      - ./src:/usr/src/app/src
      - ./test:/usr/src/app/test
      - ./test/generators/startup.relational.test.sh:/opt/startup.relational.test.sh
